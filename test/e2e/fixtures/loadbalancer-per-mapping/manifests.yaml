metadata:
  name: loadbalancer-per-mapping-maglev-cookie-no-ttl
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /loadbalancer-per-mapping/maglev/cookie-no-ttl/
