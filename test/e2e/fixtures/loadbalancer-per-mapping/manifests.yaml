---
apiVersion: v1
kind: Pod
metadata:
  name: lb-per-mapping-1
  labels:
    app: loadbalancer-per-mapping-backend
spec:
  containers:
    - name: kat-server
      image: (env('KAT_SERVER_IMAGE'))
      imagePullPolicy: IfNotPresent
      command: ["/work/kat-server"]
      env:
        - name: BACKEND
          value: lb-per-mapping-1
      ports:
        - containerPort: 8080
          name: http
          protocol: TCP
---
apiVersion: v1
kind: Pod
metadata:
  name: lb-per-mapping-2
  labels:
    app: loadbalancer-per-mapping-backend
spec:
  containers:
    - name: kat-server
      image: (env('KAT_SERVER_IMAGE'))
      imagePullPolicy: IfNotPresent
      command: ["/work/kat-server"]
      env:
        - name: BACKEND
          value: lb-per-mapping-2
      ports:
        - containerPort: 8080
          name: http
          protocol: TCP
---
apiVersion: v1
kind: Pod
metadata:
  name: lb-per-mapping-3
  labels:
    app: loadbalancer-per-mapping-backend
spec:
  containers:
    - name: kat-server
      image: (env('KAT_SERVER_IMAGE'))
      imagePullPolicy: IfNotPresent
      command: ["/work/kat-server"]
      env:
        - name: BACKEND
          value: lb-per-mapping-3
      ports:
        - containerPort: 8080
          name: http
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: loadbalancer-per-mapping-backend
spec:
  selector:
    app: loadbalancer-per-mapping-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
# Named to this fixture rather than the literal "endpoint" KAT uses, so a
# concurrent fixture never resolves the wrong KubernetesEndpointResolver.
apiVersion: getambassador.io/v3alpha1
kind: KubernetesEndpointResolver
metadata:
  name: loadbalancer-per-mapping-resolver
spec:
  ambassador_id: [(env('SLOT'))]
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: loadbalancer-per-mapping-ring-hash-header
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /loadbalancer-per-mapping/ring-hash/header/
  service: loadbalancer-per-mapping-backend:8080
  resolver: loadbalancer-per-mapping-resolver
  load_balancer:
    policy: ring_hash
    header: LB-HEADER
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: loadbalancer-per-mapping-ring-hash-source-ip
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /loadbalancer-per-mapping/ring-hash/source-ip/
  service: loadbalancer-per-mapping-backend:8080
  resolver: loadbalancer-per-mapping-resolver
  load_balancer:
    policy: ring_hash
    source_ip: true
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: loadbalancer-per-mapping-ring-hash-cookie
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /loadbalancer-per-mapping/ring-hash/cookie/
  service: loadbalancer-per-mapping-backend:8080
  resolver: loadbalancer-per-mapping-resolver
  load_balancer:
    policy: ring_hash
    cookie:
      name: lb-cookie
      ttl: 125s
      path: /foo
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: loadbalancer-per-mapping-ring-hash-cookie-no-ttl
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /loadbalancer-per-mapping/ring-hash/cookie-no-ttl/
  service: loadbalancer-per-mapping-backend:8080
  resolver: loadbalancer-per-mapping-resolver
  load_balancer:
    policy: ring_hash
    cookie:
      name: lb-cookie
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: loadbalancer-per-mapping-maglev-header
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /loadbalancer-per-mapping/maglev/header/
  service: loadbalancer-per-mapping-backend:8080
  resolver: loadbalancer-per-mapping-resolver
  load_balancer:
    policy: maglev
    header: LB-HEADER
