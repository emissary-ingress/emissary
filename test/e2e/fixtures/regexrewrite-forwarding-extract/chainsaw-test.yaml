---
# Port of KAT's tests/kat/t_regexrewrite_forwarding.py::RegexRewriteForwardingWithExtractAndSubstituteTest.
#
# KAT:      queries() yields four Query objects, check() asserts on
#           results[N].backend.request.url.path and the
#           x-envoy-original-path header for the two capture-group rewrites.
# Chainsaw: queries.json holds the same four queries, and the jq expression
#           below is the check(). Request headers come back lowercased from
#           kat-server, so the header key is "x-envoy-original-path".
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    slot: shared
  name: regexrewrite-forwarding-extract
spec:
  steps:
    - name: apply-and-probe
      try:
        - apply:
            file: manifests.yaml
        - script:
            timeout: 2m
            content: |
              ../../probe.sh queries.json \
                'first id reaches the target'          '.[0].result.status == 200 and .[0].result.json.backend == "rrfe-target"' \
                'first id is rewritten with its group'  '.[0].result.json.request.url.path == "/bar/123456789"' \
                'original path header on first id'      '.[0].result.json.request.headers["x-envoy-original-path"] == ["/regexrewrite-forwarding-extract/123456789/list"]' \
                'second id reaches the target'          '.[1].result.status == 200 and .[1].result.json.backend == "rrfe-target"' \
                'second id is rewritten with its group' '.[1].result.json.request.url.path == "/bar/987654321"' \
                'original path header on second id'     '.[1].result.json.request.headers["x-envoy-original-path"] == ["/regexrewrite-forwarding-extract/987654321/list"]' \
                'prefix mismatch is a 404'               '.[2].result.status == 404' \
                'no id reaches the target unrewritten'  '.[3].result.status == 200 and .[3].result.json.backend == "rrfe-target"' \
                'no id leaves the path alone'           '.[3].result.json.request.url.path == "/regexrewrite-forwarding-extract/"'
