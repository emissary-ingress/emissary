---
# The target stays in the test's own namespace; only the Secret and
# TLSContext move to a literal other namespace (created by namespace.yaml,
# applied before this file), because the point of this scenario is that
# TCPMapping.spec.tls resolves a TLSContext by bare name across namespaces
# with no namespace qualifier available on the field.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target
  template:
    metadata:
      labels:
        app: target
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: target
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: target
spec:
  selector:
    app: target
  ports:
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
---
apiVersion: getambassador.io/v3alpha1
kind: Listener
metadata:
  name: tcp-listener
spec:
  ambassador_id: [(env('SLOT'))]
  port: 6789
  protocol: TCP
  securityModel: INSECURE
  hostBinding:
    namespace:
      from: ALL
---
apiVersion: getambassador.io/v3alpha1
kind: TLSContext
metadata:
  name: tlsclient
  namespace: tcpmapping-tls-origination-context-cross-namespace-other
spec:
  ambassador_id: [(env('SLOT'))]
  secret: tlsclient-cert
  sni: my-hysterical-name
---
apiVersion: getambassador.io/v3alpha1
kind: TCPMapping
metadata:
  name: target
spec:
  ambassador_id: [(env('SLOT'))]
  port: 6789
  service: target:443
  tls: tlsclient
