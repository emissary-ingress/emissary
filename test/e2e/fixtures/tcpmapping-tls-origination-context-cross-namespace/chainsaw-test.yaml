---
# Port of KAT's tests/kat/t_tcpmapping.py::TCPMappingTLSOriginationContextCrossNamespaceTest.
#
# You can select a TLSContext from any namespace by bare name on
# TCPMapping.spec.tls; that's surprising, but changing it would break
# existing users, so this pins the behavior down. No explicit namespace
# teardown step is needed: chainsaw's built-in cleanup deletes every
# resource a step's `apply` created, including a Namespace object, the same
# as it does for tcpmapping-cross-namespace, but only for a namespace
# chainsaw itself created. The other namespace has to exist before the cert
# script can put a Secret in it, so it's applied here first and separately,
# rather than left to a raw kubectl call inside the script step; a resource
# a script creates by hand is invisible to that cleanup tracking and would
# leak.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    slot: exclusive
  name: tcpmapping-tls-origination-context-cross-namespace
spec:
  steps:
    - name: create the other namespace
      try:
        - apply:
            file: namespace.yaml

    - name: generate the client cert
      try:
        - script:
            content: |
              set -eu
              dir=$(mktemp -d)
              trap 'rm -rf "$dir"' EXIT
              openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
                -subj /CN=tcpmapping-tls-origination-context-cross-namespace \
                -addext basicConstraints=critical,CA:FALSE \
                -addext keyUsage=critical,digitalSignature \
                -addext extendedKeyUsage=clientAuth \
                -keyout "$dir/tls.key" -out "$dir/tls.crt" 2>/dev/null
              kubectl create secret tls tlsclient-cert \
                -n tcpmapping-tls-origination-context-cross-namespace-other \
                --cert="$dir/tls.crt" --key="$dir/tls.key"

    - name: apply
      try:
        - apply:
            file: manifests.yaml

    - name: origination sent the cross-namespace TLSContext's sni override
      try:
        - script:
            timeout: 2m
            content: |
              PROBE_BASE="${GATEWAY_TCP_URL}" ../../probe.sh queries.json \
                'reached the target'   '.[0].result.status == 200 and .[0].result.json.backend == "target"' \
                'origination used TLS' '.[0].result.json.request.tls.enabled == true' \
                'sni override reached the backend' '.[0].result.json.request.tls["server-name"] == "my-hysterical-name"'
