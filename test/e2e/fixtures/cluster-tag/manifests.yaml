---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target1
  template:
    metadata:
      labels:
        app: target1
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: target1
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: target1
spec:
  selector:
    app: target1
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
