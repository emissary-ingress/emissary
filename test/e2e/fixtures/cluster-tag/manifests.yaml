      port: 8080
      targetPort: 8080
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: cluster-tag-1
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /mapping-1/
  service: target1:8080
---
