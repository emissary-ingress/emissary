---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qpr-target1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qpr-target1
  template:
    metadata:
      labels:
        app: qpr-target1
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: qpr-target1
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: qpr-target1
spec:
  selector:
    app: qpr-target1
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qpr-target2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qpr-target2
  template:
    metadata:
      labels:
        app: qpr-target2
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: qpr-target2
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: qpr-target2
spec:
  selector:
    app: qpr-target2
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: queryparameter-routing-target1
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /queryparameter-routing/
  service: qpr-target1:8080
---
# Same prefix, but only matches when test_param=target2 is present. Envoy
# evaluates the query-parameter-constrained route first, so a request with no
# matching parameter falls through to target1.
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: queryparameter-routing-target2
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /queryparameter-routing/
  service: qpr-target2:8080
  query_parameters:
    test_param: target2
