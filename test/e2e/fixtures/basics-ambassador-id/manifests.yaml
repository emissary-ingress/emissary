---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target
  template:
    metadata:
      labels:
        app: target
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: target
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: target
spec:
  selector:
    app: target
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: getambassador.io/v3alpha1
kind: Module
metadata:
  name: ambassador
spec:
  ambassador_id: [(env('SLOT'))]
  config:
    use_ambassador_namespace_for_service_resolution: true
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: findme
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /findme/
  service: (join(':', [join('.', ['target', $namespace]), '8080']))
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: findme-array
spec:
  ambassador_id: [(env('SLOT')), missme]
  hostname: "*"
  prefix: /findme-array/
  service: (join(':', [join('.', ['target', $namespace]), '8080']))
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: findme-array2
spec:
  ambassador_id: [missme, (env('SLOT'))]
  hostname: "*"
  prefix: /findme-array2/
  service: (join(':', [join('.', ['target', $namespace]), '8080']))
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: missme
spec:
  ambassador_id: [missme]
  hostname: "*"
  prefix: /missme/
  service: (join(':', [join('.', ['target', $namespace]), '8080']))
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: missme-array
spec:
  ambassador_id: [missme1, missme2]
  hostname: "*"
  prefix: /missme-array/
  service: (join(':', [join('.', ['target', $namespace]), '8080']))
