---
# Port of KAT's tests/kat/t_extauth.py::AuthenticationHTTPBufferedTest.
#
# One target plus an HTTPS auth service, with a Module that enables the
# request buffer and linkerd headers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target
  template:
    metadata:
      labels:
        app: target
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: target
            - name: INCLUDE_EXTAUTH_HEADER
              value: "yes"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: target
spec:
  selector:
    app: target
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: auth
            - name: INCLUDE_EXTAUTH_HEADER
              value: "yes"
          ports:
            - containerPort: 8080
---
# Port 443, not 8443: an AuthService's `auth_service` with no port defaults to 443
# once a `tls` context is attached. kat-server always runs a TLS-terminating
# listener on 8443 alongside its plain one on 8080.
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: auth
  ports:
    - name: https
      port: 443
      targetPort: 8443
---
apiVersion: getambassador.io/v3alpha1
kind: Module
metadata:
  name: ambassador
spec:
  ambassador_id: [(env('SLOT'))]
  config:
    add_linkerd_headers: true
    buffer:
      max_request_bytes: 16384
---
apiVersion: getambassador.io/v3alpha1
kind: TLSContext
metadata:
  name: auth-buffered-context
spec:
  ambassador_id: [(env('SLOT'))]
  secret: auth-buffered-secret
---
apiVersion: getambassador.io/v3alpha1
kind: AuthService
metadata:
  name: auth
spec:
  ambassador_id: [(env('SLOT'))]
  auth_service: (join('.', ['auth', $namespace]))
  path_prefix: "/extauth"
  timeout_ms: 5000
  tls: auth-buffered-context
  allowed_request_headers:
    - X-Foo
    - X-Bar
    - Kat-Req-Http-Requested-Status
    - Kat-Req-Http-Requested-Header
    - Kat-Req-Http-Requested-Cookie
    - Location
  allowed_authorization_headers:
    - X-Foo
    - Set-Cookie
  include_body:
    max_bytes: 4096
    allow_partial: true
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: target
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /target/
  service: (join('.', ['target', $namespace]))
