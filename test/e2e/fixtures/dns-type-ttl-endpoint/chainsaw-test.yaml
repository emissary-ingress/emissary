---
# Port of KAT's tests/kat/t_dns_type.py::DnsTtlEndpoint.
#
# respect_dns_ttl combined with the endpoint resolver; see dns-type-logical-endpoint
# for why the resolver is named for this fixture rather than KAT's literal "endpoint".
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    slot: shared
  name: dns-type-ttl-endpoint
spec:
  steps:
    - name: apply-and-probe
      try:
        - apply:
            file: manifests.yaml
        - script:
            timeout: 2m
            content: |
              ../../probe.sh queries.json \
                'status is 200'         '.[0].result.status == 200' \
                'reached the backend'   '.[0].result.json.backend == "dns-type-ttl-endpoint-echo"'
