---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target
  template:
    metadata:
      labels:
        app: target
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: target
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: target
spec:
  selector:
    app: target
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# hostname is the literal "ambassador.example.com"; the queries send a
# port-free "Host" header for both ":authority" and (with "sni: true") the
# TLS ServerName, which is what a literal hostname needs to match.
apiVersion: getambassador.io/v3alpha1
kind: Host
metadata:
  name: host-client-cert-same-namespace
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: ambassador.example.com
  acmeProvider:
    authority: none
  tlsSecret:
    name: host-client-cert-same-namespace-server
  tls:
    ca_secret: host-client-cert-same-namespace-ca
    cert_required: true
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: target
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /
  service: target:8080
