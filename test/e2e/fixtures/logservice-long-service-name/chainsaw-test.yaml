# Port of KAT's tests/kat/t_logservice.py::LogServiceLongServiceNameTest.
#
# `exclusive` because a LogService is instance-global. The ALS backend is read
# back through a Mapping, so its own requests are logged too; the assertions
# look only at the /target/ entries. The LogService names its backend with the
# test namespace because the global config is resolved outside it. The ALS
# Service name is 56 characters, which the generated cluster name must survive.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    slot: exclusive
  name: logservice-long-service-name
spec:
  steps:
    - name: apply
      try:
        - apply:
            file: manifests.yaml
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: als
              status:
                availableReplicas: 1
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: target
              status:
                availableReplicas: 1

    - name: wait for access logging
      try:
        - script:
            timeout: 3m
            content: |
              ../../probe.sh queries-warmup.json \
                'target is routed'          '.[0].result.json.backend == "target"' \
                'warmup request was logged' '[.[1].result.json["alsv3-http"][]? | .request.original_path | select(. == "/target/warmup")] | length > 0'

    - name: send traffic
      try:
        - script:
            timeout: 3m
            content: |
              q=$(mktemp)
              echo '[{"url": "/als/logs", "method": "DELETE"}]' > "$q"
              ../../probe.sh "$q" 'log buffer cleared' '.[0].result.status == 200'
              for p in foo bar; do
                echo "[{\"url\": \"/target/$p\", \"method\": \"GET\"}]" > "$q"
                ../../probe.sh "$q" "$p reaches the target" '.[0].result.json.backend == "target"'
              done

    - name: access logs reach the als
      try:
        - script:
            timeout: 3m
            content: |
              t='[.[0].result.json["alsv3-http"][]? | .request.original_path | select(startswith("/target/") and . != "/target/warmup")]'
              ../../probe.sh queries-logs.json \
                'both requests were logged in order' "(${t} == [\"/target/foo\", \"/target/bar\"])" \
                'nothing came in as v2'              '(.[0].result.json["alsv2-http"] // []) == [] and (.[0].result.json["alsv2-tcp"] // []) == []' \
                'nothing came in as v3 tcp'          '(.[0].result.json["alsv3-tcp"] // []) == []'
