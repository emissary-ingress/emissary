---
# Port of KAT's tests/kat/t_mappingtests_plain.py::RemoveReqHeadersMapping.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    slot: shared
  name: mapping-remove-request-headers
spec:
  steps:
    - name: apply-and-probe
      try:
        - apply:
            file: manifests.yaml
        - script:
            timeout: 2m
            content: |
              ../../probe.sh queries.json \
                'reached the backend'   '.[0].result.status == 200 and .[0].result.json.backend == "mapping-remove-request-headers"' \
                'unlisted header kept'  '.[0].result.json.request.headers["foo"] == ["FooF"]' \
                'zoo removed'           '.[0].result.json.request.headers | has("zoo") | not' \
                'aoo removed'           '.[0].result.json.request.headers | has("aoo") | not'
