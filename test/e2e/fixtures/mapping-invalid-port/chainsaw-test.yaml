---
# Port of KAT's tests/kat/t_mappingtests_plain.py::InvalidPortMapping.
#
# `exclusive` because it probes /ambassador/v0/diag/, which only a numbered
# slot serves (see slots.sh).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    slot: exclusive
  name: mapping-invalid-port
spec:
  steps:
    - name: apply-and-probe
      try:
        - apply:
            file: manifests.yaml
        - script:
            timeout: 2m
            content: |
              ../../probe.sh queries.json \
                'diag reports the invalid port' '[.[0].result.json[][] | strings | select(contains("found invalid port for service"))] | length > 0'
