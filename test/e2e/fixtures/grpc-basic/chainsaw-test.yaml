apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    slot: default
  name: grpc-basic
spec:
  bindings:
    - name: kat_server_image
      value: (env('KAT_SERVER_IMAGE'))
  steps:
    - name: apply-and-probe
      try:
        - apply:
            file: manifests.yaml
            template: true
        - script:
            timeout: 2m
            content: |
              ../../probe.sh queries.json '
                .[0].result.status == 200 and
                .[0].result.headers["Grpc-Status"][0] == "0"
              '
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - podLogs:
            selector: app=grpc-echo
            tail: 200
        - get:
            apiVersion: getambassador.io/v3alpha1
            kind: Mapping
        - script:
            content: |
              kubectl -n emissary logs -l app.kubernetes.io/name=emissary-ingress --tail=200 || true
