---
# Port of KAT's tests/kat/t_tcpmapping.py::TCPMappingSNISeparateContextsTest.
#
# KAT parameterizes this class across a TLSContext-provided cert and a
# Host-provided one; only the TLSContext variant is ported here, for a
# one-fixture-per-class mapping to the KAT source.
#
# Two TLSContexts, each with its own single-host cert, both attached to the
# same Listener: the point is that per-host certs on one port don't bleed
# into each other, unlike tcpmapping-sni-shared-context's one cert for two
# hosts.
#
# GATEWAY_TCP_URL is an "http://" URL; re-spelling the scheme is enough to
# speak TLS to the same port, same as tcpmapping-tls-termination-basic. The
# swap uses POSIX prefix removal because script steps run under /bin/sh.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    slot: exclusive
  name: tcpmapping-sni-separate-contexts
spec:
  steps:
    - name: generate the two downstream certs
      try:
        - script:
            content: |
              set -eu
              dir=$(mktemp -d)
              trap 'rm -rf "$dir"' EXIT

              openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
                -subj /CN=a.sni-separate.example.com \
                -addext basicConstraints=critical,CA:FALSE \
                -addext keyUsage=critical,digitalSignature,keyEncipherment \
                -addext extendedKeyUsage=serverAuth \
                -addext subjectAltName=DNS:a.sni-separate.example.com \
                -keyout "$dir/a.key" -out "$dir/a.crt" 2>/dev/null
              kubectl create secret tls tlsserver-cert-a \
                -n "$NAMESPACE" --cert="$dir/a.crt" --key="$dir/a.key"

              openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
                -subj /CN=b.sni-separate.example.com \
                -addext basicConstraints=critical,CA:FALSE \
                -addext keyUsage=critical,digitalSignature,keyEncipherment \
                -addext extendedKeyUsage=serverAuth \
                -addext subjectAltName=DNS:b.sni-separate.example.com \
                -keyout "$dir/b.key" -out "$dir/b.crt" 2>/dev/null
              kubectl create secret tls tlsserver-cert-b \
                -n "$NAMESPACE" --cert="$dir/b.crt" --key="$dir/b.key"

    - name: apply
      try:
        - apply:
            file: manifests.yaml

    - name: SNI on separate TLSContexts routes each host to its own backend
      try:
        - script:
            timeout: 2m
            content: |
              PROBE_BASE="https://${GATEWAY_TCP_URL#http://}" ../../probe.sh queries.json \
                'host a reached target-a'         '.[0].result.status == 200 and .[0].result.json.backend == "target-a"' \
                'host a terminated before the backend' '.[0].result.json.request.tls.enabled == false' \
                'host b reached target-b'         '.[1].result.status == 200 and .[1].result.json.backend == "target-b"' \
                'host b terminated before the backend' '.[1].result.json.request.tls.enabled == false'
