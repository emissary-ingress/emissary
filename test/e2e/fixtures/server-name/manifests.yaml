---
apiVersion: getambassador.io/v3alpha1
kind: Module
metadata:
  name: ambassador
spec:
  ambassador_id: [(env('SLOT'))]
  config:
    server_name: "test-server"
---
# Prefix has no trailing slash on purpose: requesting /server-name/ makes
# Envoy emit its own 301, which is the response the Server header is read off.
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: server-name-target
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /server-name
  service: http-echo:8080
