---
# Port of KAT's tests/kat/t_basics.py::ServerNameTest.
#
# The subject is the Module's `server_name` reaching the `Server` response
# header. KAT also asserted the exact redirect code (301), but that is
# incidental to what is being tested and is not stable: this returns 301 on the
# GitHub runners and 307 on a local k3d cluster, deterministically in each.
# Asserting any 3xx keeps the test honest about its subject without encoding an
# environment-specific detail.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    slot: exclusive
  name: server-name
spec:
  steps:
    - name: apply-and-probe
      try:
        - apply:
            file: manifests.yaml
        - script:
            timeout: 2m
            content: |
              ../../probe.sh queries.json '
                (.[0].result.status >= 300 and .[0].result.status < 400) and
                .[0].result.headers["Server"][0] == "test-server"
              '
