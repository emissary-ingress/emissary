---
apiVersion: v1
kind: Namespace
metadata:
  name: tls-istio-secret-secrets
---
apiVersion: v1
kind: Secret
metadata:
  name: istio.test-tlscontext-istio-secret-1
  namespace: tls-istio-secret-secrets
type: istio.io/key-and-cert
data:
  cert-chain.pem: 
  key.pem: 
  root-cert.pem: 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target
  template:
    metadata:
      labels:
        app: target
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: target
          ports:
            - containerPort: 8443
              name: https
---
apiVersion: v1
kind: Service
metadata:
  name: target
spec:
  selector:
    app: target
  ports:
    - name: https
      port: 443
      targetPort: 8443
---
apiVersion: getambassador.io/v3alpha1
kind: TLSContext
metadata:
  name: istio-context
  namespace: tls-istio-secret-secrets
spec:
  ambassador_id: [(env('SLOT'))]
  secret: istio.test-tlscontext-istio-secret-1
  secret_namespacing: false
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: istio-prefix
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /tls-context-istio/
  service: https://target
  tls: istio-context
