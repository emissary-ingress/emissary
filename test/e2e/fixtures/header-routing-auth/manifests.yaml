---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target1
  template:
    metadata:
      labels:
        app: target1
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: target1
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: target1
spec:
  selector:
    app: target1
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target2
  template:
    metadata:
      labels:
        app: target2
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: target2
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: target2
spec:
  selector:
    app: target2
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# test-auth is built from this repo for the runner's own architecture, so it is
# derived from the kat-server image reference.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: test-auth
          image: (replace(env('KAT_SERVER_IMAGE'), 'kat-server', 'test-auth', `-1`))
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND
              value: auth
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: auth
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: getambassador.io/v3alpha1
kind: AuthService
metadata:
  name: auth
spec:
  ambassador_id: [(env('SLOT'))]
  auth_service: (join('.', ['auth', $namespace]))
  proto: http
  path_prefix: ""
  timeout_ms: 5000
  allowed_authorization_headers:
    - X-Auth-Route
    - Extauth
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: target1
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /target/
  service: http://target1:8080
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: target2
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /target/
  service: http://target2:8080
  headers:
    X-Auth-Route: Route
