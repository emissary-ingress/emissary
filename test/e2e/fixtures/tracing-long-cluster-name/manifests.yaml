---
# Port of KAT's tests/kat/t_tracing.py::TracingTestLongClusterName.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target
  template:
    metadata:
      labels:
        app: target
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: target
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: target
spec:
  selector:
    app: target
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:2.27
          ports:
            - name: http
              containerPort: 9411
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin-collector-with-a-long-name-that-forces-name-compression
spec:
  selector:
    app: zipkin
  ports:
    - name: http
      port: 9411
      targetPort: http
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: target
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /target/
  service: target:8080
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: zipkin
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /zipkin/
  rewrite: /
  service: zipkin-collector-with-a-long-name-that-forces-name-compression:9411
---
apiVersion: getambassador.io/v3alpha1
kind: TracingService
metadata:
  name: tracing
spec:
  ambassador_id: [(env('SLOT'))]
  service: (join(':', [join('.', ['zipkin-collector-with-a-long-name-that-forces-name-compression', $namespace]), '9411']))
  driver: zipkin
