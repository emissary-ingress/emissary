---
# Port of KAT's tests/kat/t_gzip.py::GzipTest.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    slot: slot2
  name: gzip-content-type
spec:
  steps:
    - name: apply-and-probe
      try:
        - apply:
            file: manifests.yaml
        - script:
            timeout: 2m
            content: |
              ../../probe.sh queries.json '
                .[0].result.status == 200 and
                .[0].result.headers["Content-Encoding"][0] == "gzip"
              '
