apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    flavor: default
  name: http-basic
spec:
  bindings:
    - name: kat_server_image
      value: (env('KAT_SERVER_IMAGE'))
    - name: kat_client
      value: (env('KAT_CLIENT'))
    - name: gateway_url
      value: (env('GATEWAY_URL'))
  steps:
    - name: apply-and-probe
      try:
        - apply:
            file: manifests.yaml
            template: true
        - script:
            timeout: 2m
            env:
              - name: KAT_CLIENT
                value: ($kat_client)
              - name: GATEWAY_URL
                value: ($gateway_url)
            content: |
              ../../probe.sh queries.json '
                .[0].result.status == 200 and
                .[0].result.json.backend == "http-echo"
              '
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - podLogs:
            selector: app=http-echo
            tail: 200
        - get:
            apiVersion: getambassador.io/v3alpha1
            kind: Mapping
        - script:
            content: |
              kubectl -n emissary logs -l app.kubernetes.io/name=emissary-ingress --tail=200 || true
