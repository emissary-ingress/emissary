# Port of KAT's tests/kat/t_active_health_check.py::NoHealthCheckTest.
#
# `shared`. A plain Mapping with no health checks, every name and prefix
# namespaced to the fixture. The loopback Mapping reads the shared Emissary's
# Envoy admin, filtered to this fixture's own cluster.
#
# Control for active-health-check: one of five pods turns unhealthy and, with
# nothing to eject it, keeps receiving traffic. The assertions are that some
# requests get a 500 while most still get a 200, not a distribution. The batch
# runs once (PROBE_ATTEMPTS=1) and at least 995 of the 1000 must land, since a
# CI runner can drop the odd connection with EOF.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    slot: shared
  name: active-health-check-none
spec:
  steps:
    - name: apply
      try:
        - apply:
            file: manifests.yaml
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: active-health-check-none-backend
              status:
                availableReplicas: 5

    - name: all five pods are known to Envoy
      try:
        - script:
            timeout: 2m
            content: |
              set -eu
              queries="$(mktemp)"
              trap 'rm -f "$queries"' EXIT
              jq -n '[{url: "/active-health-check-none/", method: "GET"}, {url: "/active-health-check-none-clusters/?format=json", method: "GET"}]' > "$queries"
              ../../probe.sh "$queries" \
                'backend is routed' '.[0].result.status == 200' \
                'five hosts in the cluster' '([.[1].result.json.cluster_statuses[] | select(.name | contains("cluster_active_health_check_none_backend")) | .host_statuses[]?] | length) == 5'

    - name: make one pod unhealthy
      try:
        - script:
            timeout: 2m
            content: |
              set -eu
              queries="$(mktemp)"
              trap 'rm -f "$queries"' EXIT
              jq -n '[{url: "/active-health-check-none/makeUnhealthy/", method: "GET"}]' > "$queries"
              ../../probe.sh "$queries" 'one pod flipped' '.[0].result.status == 200'

    - name: the unhealthy pod keeps receiving traffic
      try:
        - script:
            timeout: 3m
            content: |
              set -eu
              queries="$(mktemp)"
              trap 'rm -f "$queries"' EXIT
              jq -n '[range(1000) | {url: "/active-health-check-none/", method: "GET"}]' > "$queries"
              PROBE_ATTEMPTS=1 ../../probe.sh "$queries" \
                'only 200 and 500 answers' \
                  'all(.[]; .result.status == null or .result.status == 200 or .result.status == 500)' \
                'enough requests landed' \
                  '([.[] | select(.result.status != null)] | length) >= 995' \
                'some requests hit the unhealthy pod' \
                  '([.[] | select(.result.status == 500)] | length) > 0' \
                'most requests still succeed' \
                  '([.[] | select(.result.status == 200)] | length) > ([.[] | select(.result.status == 500)] | length)'
