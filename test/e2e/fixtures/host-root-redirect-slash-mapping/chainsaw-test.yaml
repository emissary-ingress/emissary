---
# Port of KAT's tests/kat/t_hosts.py::HostCRDRootRedirectSlashMapping.
#
# `exclusive` because a Host reconfigures the listener's TLS, which is
# instance-global.
#
# Unlike host-root-redirect-congratulations, this Host has a Mapping on
# prefix "/", so it does have a route. With a route present, the Redirect
# action behaves as documented: cleartext requests get a 301 to https
# instead of the bare 404 seen when the Host has no Mapping at all.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    slot: exclusive
  name: host-root-redirect-slash-mapping
spec:
  steps:
    - name: generate the downstream cert
      try:
        - script:
            content: |
              set -eu
              dir=$(mktemp -d)
              trap 'rm -rf "$dir"' EXIT
              openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
                -subj /CN=tls-context-host-1 \
                -addext basicConstraints=critical,CA:FALSE \
                -addext keyUsage=critical,digitalSignature,keyEncipherment \
                -addext extendedKeyUsage=serverAuth \
                -addext subjectAltName=DNS:tls-context-host-1 \
                -keyout "$dir/tls.key" -out "$dir/tls.crt" 2>/dev/null
              kubectl create secret tls host-root-redirect-slash-mapping-tls \
                -n "$NAMESPACE" --cert="$dir/tls.crt" --key="$dir/tls.key"

    - name: apply
      try:
        - apply:
            file: manifests.yaml

    - name: cleartext redirects to https
      try:
        - script:
            timeout: 2m
            content: |
              PROBE_BASE="$GATEWAY_URL" ../../probe.sh queries-http.json \
                'root path redirects'   '.[0].result.status == 301' \
                'other path redirects'  '.[1].result.status == 301'

    - name: https reaches the target on both paths
      try:
        - script:
            timeout: 2m
            content: |
              PROBE_BASE="$GATEWAY_HTTPS_URL" ../../probe.sh queries-https.json \
                'root path reaches the target'    '.[0].result.status == 200' \
                'root hits target backend'        '.[0].result.json.backend == "target"' \
                'other path reaches the target'   '.[1].result.status == 200' \
                'other hits target backend'       '.[1].result.json.backend == "target"'
