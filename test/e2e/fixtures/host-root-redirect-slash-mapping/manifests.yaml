---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target
  template:
    metadata:
      labels:
        app: target
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: target
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: target
spec:
  selector:
    app: target
  ports:
    - name: http
      port: 8080
---
# Same shape as host-root-redirect-congratulations, but with a Mapping
# on prefix "/" so the Host actually has a route. That is enough to flip
# the cleartext behavior from a bare 404 to the expected redirect.
apiVersion: getambassador.io/v3alpha1
kind: Host
metadata:
  name: host-root-redirect-slash-mapping
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: tls-context-host-1
  acmeProvider:
    authority: none
  mappingSelector:
    matchLabels:
      hostname: host-root-redirect-slash-mapping
  tlsSecret:
    name: host-root-redirect-slash-mapping-tls
  requestPolicy:
    insecure:
      action: Redirect
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: target
  labels:
    hostname: host-root-redirect-slash-mapping
spec:
  ambassador_id: [(env('SLOT'))]
  prefix: /
  service: target:8080
