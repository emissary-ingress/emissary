---
# Port of KAT's tests/kat/t_dns_type.py::LogicalDnsType.
#
# dns_type: logical_dns only changes how Envoy resolves the upstream cluster
# (LOGICAL_DNS instead of the default STRICT_DNS); a plain 200 confirms the
# request still reaches the backend under that resolution mode.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    slot: shared
  name: dns-type-logical
spec:
  steps:
    - name: apply-and-probe
      try:
        - apply:
            file: manifests.yaml
        - script:
            timeout: 2m
            content: |
              ../../probe.sh queries.json \
                'status is 200'         '.[0].result.status == 200' \
                'reached the backend'   '.[0].result.json.backend == "dns-type-logical-echo"'
