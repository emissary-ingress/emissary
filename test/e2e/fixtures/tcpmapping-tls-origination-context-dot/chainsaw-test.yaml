---
# Port of KAT's tests/kat/t_tcpmapping.py::TCPMappingTLSOriginationContextWithDotTest.
#
# Identical to tcpmapping-tls-origination-context except the TLSContext's
# name contains a dot, which TCPMapping.spec.tls has to resolve by exact
# name rather than treating the dot as a namespace or path separator.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    slot: exclusive
  name: tcpmapping-tls-origination-context-dot
spec:
  steps:
    - name: generate the client cert
      try:
        - script:
            content: |
              set -eu
              dir=$(mktemp -d)
              trap 'rm -rf "$dir"' EXIT
              openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
                -subj /CN=tcpmapping-tls-origination-context-dot \
                -addext basicConstraints=critical,CA:FALSE \
                -addext keyUsage=critical,digitalSignature \
                -addext extendedKeyUsage=clientAuth \
                -keyout "$dir/tls.key" -out "$dir/tls.crt" 2>/dev/null
              kubectl create secret tls tlsclient-cert \
                -n "$NAMESPACE" --cert="$dir/tls.crt" --key="$dir/tls.key"

    - name: apply
      try:
        - apply:
            file: manifests.yaml

    - name: origination sent the dotted TLSContext's sni override
      try:
        - script:
            timeout: 2m
            content: |
              PROBE_BASE="${GATEWAY_TCP_URL}" ../../probe.sh queries.json \
                'reached the target'   '.[0].result.status == 200 and .[0].result.json.backend == "target"' \
                'origination used TLS' '.[0].result.json.request.tls.enabled == true' \
                'sni override reached the backend' '.[0].result.json.request.tls["server-name"] == "my-hilarious-name"'
