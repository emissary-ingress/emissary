---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-type-logical-endpoint-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-type-logical-endpoint-echo
  template:
    metadata:
      labels:
        app: dns-type-logical-endpoint-echo
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: dns-type-logical-endpoint-echo
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: dns-type-logical-endpoint-echo
spec:
  selector:
    app: dns-type-logical-endpoint-echo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
# Named to this fixture rather than the literal "endpoint" KAT uses, so a
# concurrent shared fixture never resolves the wrong KubernetesEndpointResolver.
apiVersion: getambassador.io/v3alpha1
kind: KubernetesEndpointResolver
metadata:
  name: dns-type-logical-endpoint-resolver
spec:
  ambassador_id: [(env('SLOT'))]
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: dns-type-logical-endpoint
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /dns-type-logical-endpoint/
  service: dns-type-logical-endpoint-echo:8080
  dns_type: logical_dns
  resolver: dns-type-logical-endpoint-resolver
