---
# Port of KAT's tests/kat/t_extauth.py::AuthenticationHTTPPartialBufferTest.
#
# `exclusive` because an AuthService is instance-global. The AuthService
# reaches the auth service over a TLSContext, so the client cert is generated
# per run: it has to be a real leaf, since a default `openssl req -x509` cert
# is a CA and BoringSSL rejects it at handshake time. The fixture asserts that
# the auth service sees only the first 7 bytes of the body when the body is
# longer, the whole body when it is shorter, and the `add_auth_headers` value.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    slot: exclusive
  name: extauth-http-partial-buffer
spec:
  steps:
    - name: generate the auth client cert
      try:
        - script:
            content: |
              set -eu
              dir=$(mktemp -d)
              trap 'rm -rf "$dir"' EXIT
              openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
                -subj /CN=tls-context-host-1 \
                -addext basicConstraints=critical,CA:FALSE \
                -addext keyUsage=critical,digitalSignature,keyEncipherment \
                -addext extendedKeyUsage=serverAuth,clientAuth \
                -keyout "$dir/tls.key" -out "$dir/tls.crt" 2>/dev/null
              kubectl create secret tls auth-partial-secret \
                -n "$NAMESPACE" --cert="$dir/tls.crt" --key="$dir/tls.key"

    - name: apply
      try:
        - apply:
            file: manifests.yaml

    - name: partial body buffering
      try:
        - script:
            timeout: 2m
            content: |
              ../../probe.sh queries.json \
                'q0 routed to the target'             '.[0].result.json.backend == "target"' \
                'q0 target saw requested status'      '.[0].result.json.request.headers["kat-req-http-requested-status"] == ["200"]' \
                'q0 client got 200'                   '.[0].result.status == 200' \
                'q0 Server is envoy'                  '.[0].result.headers["Server"] == ["envoy"]' \
                'q0 auth got the first 7 bytes'       '(.[0].result.headers["Extauth"][0] | fromjson | .request.headers["kat-resp-http-request-body"]) == ["message"]' \
                'q1 routed to the target'             '.[1].result.json.backend == "target"' \
                'q1 target saw requested status'      '.[1].result.json.request.headers["kat-req-http-requested-status"] == ["200"]' \
                'q1 client got 200'                   '.[1].result.status == 200' \
                'q1 Server is envoy'                  '.[1].result.headers["Server"] == ["envoy"]' \
                'q1 auth got the whole body'          '(.[1].result.headers["Extauth"][0] | fromjson | .request.headers["kat-resp-http-request-body"]) == ["body"]' \
                'q2 answered by auth'                 '.[2].result.json.backend == "auth"' \
                'q2 auth saw requested status'        '.[2].result.json.request.headers["kat-req-http-requested-status"] == ["401"]' \
                'q2 auth saw the added header'        '.[2].result.json.request.headers["x-added-auth"] == ["auth-added"]' \
                'q2 client got 401'                   '.[2].result.status == 401' \
                'q2 Server is envoy'                  '.[2].result.headers["Server"] == ["envoy"]'
