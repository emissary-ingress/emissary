---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target
  template:
    metadata:
      labels:
        app: target
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: target
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: target
spec:
  selector:
    app: target
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# hostname is "*" rather than "localhost": the client reaches the gateway as
# localhost on a slot-specific port, and Envoy's virtual host domain match is
# against the ":authority" header including that port, which varies at run
# time and can't be hardcoded here. "*" matches any authority, and also
# leaves the TLS filter chain's SNI match wide open, which is fine since the
# query below never sets "sni".
apiVersion: getambassador.io/v3alpha1
kind: Host
metadata:
  name: host-tls
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  acmeProvider:
    authority: none
  tlsSecret:
    name: host-tls-secret
  mappingSelector:
    matchLabels:
      host: host-tls
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: target
  labels:
    host: host-tls
spec:
  ambassador_id: [(env('SLOT'))]
  prefix: /target/
  service: target:8080
