---
# Port of KAT's tests/kat/t_tcpmapping.py::TCPMappingTLSOriginationV3SchemeTest.
#
# An "https://" prefix on the TCPMapping's `service` originates TLS to the
# backend with no named TLSContext. The downstream side of the mapping stays
# plain TCP.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    slot: exclusive
  name: tcpmapping-tls-origination-scheme
spec:
  steps:
    - name: apply-and-probe
      try:
        - apply:
            file: manifests.yaml
        - script:
            timeout: 2m
            content: |
              PROBE_BASE="${GATEWAY_TCP_URL}" ../../probe.sh queries.json \
                'reached the target'      '.[0].result.status == 200 and .[0].result.json.backend == "target"' \
                'origination used TLS'    '.[0].result.json.request.tls.enabled == true'
