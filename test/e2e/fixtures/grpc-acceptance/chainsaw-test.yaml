---
# Port of KAT's tests/kat/t_grpc.py::AcceptanceGrpcTest.
#
# `exclusive` because it probes /ambassador/v0/diag/, which only a numbered
# slot serves (see slots.sh).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    slot: exclusive
  name: grpc-acceptance
spec:
  steps:
    - name: apply-and-probe
      try:
        - apply:
            file: manifests.yaml
        - script:
            timeout: 2m
            content: |
              ../../probe.sh queries.json \
                'status 0 is echoed'  '.[0].result.status == 200 and .[0].result.headers["Grpc-Status"] == ["0"]' \
                'status 7 is echoed'  '.[1].result.status == 200 and .[1].result.headers["Grpc-Status"] == ["7"]' \
                'no diag errors'      '.[2].result.json == []'
