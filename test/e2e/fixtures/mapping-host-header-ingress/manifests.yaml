---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mapping-host-header-ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mapping-host-header-ingress
  template:
    metadata:
      labels:
        app: mapping-host-header-ingress
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: mapping-host-header-ingress
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: mapping-host-header-ingress
spec:
  selector:
    app: mapping-host-header-ingress
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mapping-host-header-ingress
  annotations:
    kubernetes.io/ingress.class: ambassador
    getambassador.io/ambassador-id: (env('SLOT'))
spec:
  rules:
    - host: inspector.external
      http:
        paths:
          - path: /mapping-host-header-ingress/
            pathType: Prefix
            backend:
              service:
                name: mapping-host-header-ingress
                port:
                  number: 8080
