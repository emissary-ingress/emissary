---
# Port of KAT's tests/kat/t_headerrouting.py::HeaderRoutingTest.
#
# KAT:      queries() yields two Query objects, check() asserts on
#           results[N].backend.name.
# Chainsaw: queries.json holds the same two queries, and the jq expression
#           below is the check().
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    flavor: default
  name: header-routing
spec:
  bindings:
    - name: kat_server_image
      value: (env('KAT_SERVER_IMAGE'))
    - name: kat_client
      value: (env('KAT_CLIENT'))
    - name: gateway_url
      value: (env('GATEWAY_URL'))
  steps:
    - name: apply-and-probe
      try:
        - apply:
            file: manifests.yaml
            template: true
        - script:
            timeout: 2m
            env:
              - name: KAT_CLIENT
                value: ($kat_client)
              - name: GATEWAY_URL
                value: ($gateway_url)
            content: |
              ../../probe.sh queries.json '
                .[0].result.status == 200 and
                .[0].result.json.backend == "hr-target1" and
                .[1].result.status == 200 and
                .[1].result.json.backend == "hr-target2"
              '
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - podLogs:
            selector: app=hr-target1
            tail: 200
        - podLogs:
            selector: app=hr-target2
            tail: 200
        - get:
            apiVersion: getambassador.io/v3alpha1
            kind: Mapping
        - script:
            content: |
              kubectl -n emissary logs -l app.kubernetes.io/name=emissary-ingress --tail=200 || true
