---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gzip-unsup-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gzip-unsup-echo
  template:
    metadata:
      labels:
        app: gzip-unsup-echo
    spec:
      containers:
        - name: kat-server
          image: ($kat_server_image)
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: gzip-unsup-echo
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: gzip-unsup-echo
spec:
  selector:
    app: gzip-unsup-echo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
# application/json is deliberately the wrong type: kat-server's body sniffs as
# text/plain, so nothing matches and the response comes back uncompressed.
apiVersion: getambassador.io/v3alpha1
kind: Module
metadata:
  name: ambassador
spec:
  ambassador_id: ["f3"]
  config:
    gzip:
      min_content_length: 32
      content_type:
        - application/json
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: gzip-unsup-target
spec:
  ambassador_id: ["f3"]
  hostname: "*"
  prefix: /target/
  service: gzip-unsup-echo:8080
