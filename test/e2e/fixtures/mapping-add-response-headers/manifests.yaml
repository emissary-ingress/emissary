---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mapping-add-response-headers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mapping-add-response-headers
  template:
    metadata:
      labels:
        app: mapping-add-response-headers
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: mapping-add-response-headers
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: mapping-add-response-headers
spec:
  selector:
    app: mapping-add-response-headers
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: mapping-add-response-headers
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /mapping-add-response-headers/
  service: mapping-add-response-headers:8080
  add_response_headers:
    koo:
      append: false
      value: KooK
    zoo:
      append: true
      value: ZooZ
    test:
      value: boo
    foo:
      value: Foo
