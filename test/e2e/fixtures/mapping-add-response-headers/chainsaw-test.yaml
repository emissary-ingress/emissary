---
# Port of KAT's tests/kat/t_mappingtests_plain.py::AddRespHeadersMapping.
# Each query names one header in Kat-Req-Http-Requested-Header, which
# kat-server copies onto its response. It takes one name per query, hence one
# query per header.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    slot: shared
  name: mapping-add-response-headers
spec:
  steps:
    - name: apply-and-probe
      try:
        - apply:
            file: manifests.yaml
        - script:
            timeout: 2m
            content: |
              ../../probe.sh queries.json \
                'append false replaces' '.[0].result.status == 200 and .[0].result.headers["Koo"] == ["KooK"]' \
                'append true adds'      '.[1].result.headers["Zoo"] == ["Zoo", "ZooZ"]' \
                'append unset adds'     '.[2].result.headers["Test"] == ["Test", "boo"]' \
                'header not set upstream' '.[2].result.headers["Foo"] == ["Foo"]'
