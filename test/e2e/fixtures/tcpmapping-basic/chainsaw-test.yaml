apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    slot: default
  name: tcpmapping-basic
spec:
  bindings:
    - name: kat_server_image
      value: (env('KAT_SERVER_IMAGE'))
    - name: kat_client
      value: (env('KAT_CLIENT'))
    - name: gateway_tcp_url
      value: (env('GATEWAY_TCP_URL'))
  steps:
    - name: apply-and-probe
      try:
        - apply:
            file: manifests.yaml
            template: true
        - script:
            timeout: 2m
            env:
              - name: KAT_CLIENT
                value: ($kat_client)
              # TCPMappings bind the slot's TCP edge port, not its HTTP one.
              - name: PROBE_BASE
                value: ($gateway_tcp_url)
            content: |
              ../../probe.sh queries.json '
                .[0].result.status == 200 and
                .[0].result.json.backend == "tcp-echo"
              '
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - podLogs:
            selector: app=tcp-echo
            tail: 200
        - get:
            apiVersion: getambassador.io/v3alpha1
            kind: TCPMapping
        - get:
            apiVersion: getambassador.io/v3alpha1
            kind: Listener
        - script:
            content: |
              kubectl -n emissary logs -l app.kubernetes.io/name=emissary-ingress --tail=200 || true
