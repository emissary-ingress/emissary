---
# Port of KAT's tests/kat/t_ratelimit.py::RateLimitV1WithTLSTest.
#
# Same target and gRPC rate limit service as ratelimit-grpc: kat-server in
# `grpc_rls` mode decides per request based on the `kat-req-rls-allow` header,
# and appends whatever `kat-req-rls-headers-append` asks for to the 429 it
# returns. The TLS here is on Emissary's upstream connection to the rls
# service, not on the downstream listener, so there is no HTTPS gateway URL
# involved and the queries are identical to ratelimit-grpc's.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target
  template:
    metadata:
      labels:
        app: target
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: target
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: target
spec:
  selector:
    app: target
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rls
  template:
    metadata:
      labels:
        app: rls
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: rls
            - name: KAT_BACKEND_TYPE
              value: grpc_rls
            # Must match the RateLimitService's protocol_version; kat-server
            # echoes it back in Kat-Resp-Rls-Protocol-Version.
            - name: GRPC_RLS_PROTOCOL_VERSION
              value: v3
          ports:
            - containerPort: 8080
---
# Port 443, not 8443: a RateLimitService's `service` with no port defaults to
# 443 once a `tls` context is attached (80 otherwise). kat-server always runs
# a second, TLS-terminating listener on 8443 alongside its plain one on 8080,
# so this Service only needs to point at it.
apiVersion: v1
kind: Service
metadata:
  name: rls
spec:
  selector:
    app: rls
  ports:
    - name: https
      port: 443
      targetPort: 8443
---
