---
# Port of KAT's tests/kat/t_ratelimit.py::RateLimitV1WithTLSTest.
#
# `exclusive` because a RateLimitService is instance-global.
#
# This is ratelimit-grpc plus a Secret and a TLSContext attached to the
# RateLimitService's `tls` field. That TLS is on Emissary's upstream
# connection to the rls service, so the queries and their assertions are
# unchanged from ratelimit-grpc.
#
# The cert is generated per run rather than kept in the repo. It has to be a
# real server leaf: Envoy's BoringSSL checks key usage during the handshake,
# so a default `openssl req -x509` cert (which is a CA) makes the upstream
# connection fail, and a TLSContext whose secret will not resolve is dropped
# from the config entirely, leaving `tls:` pointing at nothing.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  labels:
    slot: exclusive
  name: ratelimit-tls
spec:
  steps:
    - name: generate the upstream cert
      try:
        - script:
            content: |
              set -eu
              dir=$(mktemp -d)
              trap 'rm -rf "$dir"' EXIT
              openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
                -subj /CN=ratelimit.datawire.io \
                -addext basicConstraints=critical,CA:FALSE \
                -addext keyUsage=critical,digitalSignature,keyEncipherment \
                -addext extendedKeyUsage=serverAuth,clientAuth \
                -keyout "$dir/tls.key" -out "$dir/tls.crt" 2>/dev/null
              kubectl create secret tls ratelimit-tls-secret \
                -n "$NAMESPACE" --cert="$dir/tls.crt" --key="$dir/tls.key"

    - name: apply
      try:
        - apply:
            file: manifests.yaml

    - name: rate limit allows and rejects per descriptor over a TLS upstream
      try:
        - script:
            timeout: 2m
            content: |
              ../../probe.sh queries.json \
                'no descriptor headers, so no rate limiting' '.[0].result.status == 200' \
                'reached the target'                         '.[0].result.json.backend == "target"' \
                'rls allowed the request'                    '.[1].result.status == 200' \
                'allowed request reached the target'         '.[1].result.json.backend == "target"' \
                'rls rejected the request'                    '.[2].result.status == 429' \
                'the 429 body came from the rls'              '.[2].result.json.backend == "rls"' \
                'rls appended Hello'                          '.[2].result.headers["Hello"] == ["Foo"]' \
                'rls appended Hi'                              '.[2].result.headers["Hi"] == ["Baz"]' \
                'rls overrode the content type'                '.[2].result.headers["Content-Type"] == ["application/json"]' \
                'rls answered over v3'                         '.[2].result.headers["Kat-Resp-Rls-Protocol-Version"] == ["v3"]'
