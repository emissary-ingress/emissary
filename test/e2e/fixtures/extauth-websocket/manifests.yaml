---
# Port of KAT's tests/kat/t_extauth.py::AuthenticationWebsocketTest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: extauth-websocket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: extauth-websocket
  template:
    metadata:
      labels:
        app: extauth-websocket
    spec:
      containers:
        - name: echo
          image: jmalloc/echo-server:v0.3.7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: extauth-websocket
spec:
  selector:
    app: extauth-websocket
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: auth
          ports:
            - containerPort: 8080
---
# Port 80, not 8080: an AuthService's `auth_service` with no port defaults to 80.
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: auth
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: getambassador.io/v3alpha1
kind: AuthService
metadata:
  name: auth
spec:
  ambassador_id: [(env('SLOT'))]
  auth_service: (join('.', ['auth', $namespace]))
  path_prefix: "/extauth"
  timeout_ms: 10000
  allowed_request_headers:
    - Kat-Req-Http-Requested-Status
  allow_request_body: true
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: extauth-websocket
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /extauth-websocket/
  service: extauth-websocket:8080
  use_websocket: true
