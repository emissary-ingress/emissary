---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-stats-selected-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grpc-stats-selected-services
  template:
    metadata:
      labels:
        app: grpc-stats-selected-services
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: grpc-stats-selected-services
            - name: KAT_BACKEND_TYPE
              value: grpc_echo
          ports:
            - containerPort: 8080
              name: grpc
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-stats-selected-services
spec:
  selector:
    app: grpc-stats-selected-services
  ports:
    - name: grpc
      port: 8080
      targetPort: 8080
      protocol: TCP
      appProtocol: grpc
---
apiVersion: getambassador.io/v3alpha1
kind: Module
metadata:
  name: ambassador
spec:
  ambassador_id: [(env('SLOT'))]
  config:
    grpc_stats:
      all_methods: true
      services:
        - name: echo.EchoService
          method_names: [Echo]
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: grpc-stats-selected-services
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /echo.EchoService/
  rewrite: ""
  grpc: true
  service: grpc-stats-selected-services:8080
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: metrics
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /metrics
  rewrite: /metrics
  service: http://127.0.0.1:8877
