---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target1
  template:
    metadata:
      labels:
        app: target1
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: target1
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: target1
spec:
  selector:
    app: target1
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target2
  template:
    metadata:
      labels:
        app: target2
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: target2
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: target2
spec:
  selector:
    app: target2
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target3
  template:
    metadata:
      labels:
        app: target3
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: target3
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: target3
spec:
  selector:
    app: target3
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: targetshared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: targetshared
  template:
    metadata:
      labels:
        app: targetshared
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: targetshared
          ports:
            - containerPort: 8080
