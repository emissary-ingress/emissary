---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target
  template:
    metadata:
      labels:
        app: target
    spec:
      containers:
        - name: kat-server
          image: (env('KAT_SERVER_IMAGE'))
          imagePullPolicy: IfNotPresent
          command: ["/work/kat-server"]
          env:
            - name: BACKEND
              value: target
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: target
spec:
  selector:
    app: target
  ports:
    - name: http
      port: 8080
---
# hostname "*" but no tlsSecret: this Host only ever configures cleartext
# routing, it never contributes a TLS filter chain. Its purpose is to prove
# that a cleartext hostname="*" is not mistaken for a TLS hostname="*".
apiVersion: getambassador.io/v3alpha1
kind: Host
metadata:
  name: host-forced-star-cleartext
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  acmeProvider:
    authority: none
  requestPolicy:
    insecure:
      action: Redirect
---
# The only Host with a cert. Because it is also the only TLS Host, its cert
# is what the downstream TLS listener falls back to for any SNI, including
# an SNI that names some other, unrecognized hostname.
apiVersion: getambassador.io/v3alpha1
kind: Host
metadata:
  name: host-forced-star-tls
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: tls-context-host-1
  acmeProvider:
    authority: none
  tlsSecret:
    name: host-forced-star-tls
  requestPolicy:
    insecure:
      action: Route
---
# hostname: "*" so this one Mapping is reachable from both Hosts above.
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: target
spec:
  ambassador_id: [(env('SLOT'))]
  hostname: "*"
  prefix: /foo/
  service: target:8080
