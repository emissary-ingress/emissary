[tool.towncrier]
directory = "docs/changes"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
template = "docs/changes/_template.md.jinja"
title_format = false
issue_format = "[#{issue}](https://github.com/emissary-ingress/emissary/issues/{issue})"
# Snippets are named <issue-number>.<type>.md, or +<anything>.<type>.md
# when there is no issue.
ignore = ["README.md", "_template.md.jinja"]

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Feature"
showcontent = true

[[tool.towncrier.type]]
directory = "fix"
name = "Fix"
showcontent = true

[[tool.towncrier.type]]
directory = "update"
name = "Update"
showcontent = true

[[tool.towncrier.type]]
directory = "change"
name = "Change"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecation"
name = "Deprecation"
showcontent = true

# Satisfies the CI check for changes that don't need a release note; the
# template drops these entries.
[[tool.towncrier.type]]
directory = "skip"
name = "Skip"
showcontent = true
