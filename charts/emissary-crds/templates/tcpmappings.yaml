                description: Port isn't a pointer because it's required.
                type: integer
              resolver:
                type: string
              service:
                type: string
              stats_name:
                type: string
              tls:
                type: string
              v2ExplicitTLS:
                description: 'V2ExplicitTLS controls some vanity/stylistic elements
                  when converting
  
                  from v3alpha1 to v2.  The values in an V2ExplicitTLS should not in
                  any
  
                  way affect the runtime operation of Emissary; except that it may affect
  
                  internal names in the Envoy config, which may in turn affect stats
  
                  names.  But it should not affect any end-user observable behavior.'
                properties:
                  serviceScheme:
                    description: 'ServiceScheme specifies how to spell and capitalize
                      the scheme-part of the
  
                      service URL.
  
  
                      Acceptable values are "http://" (case-insensitive), "https://"
  
                      (case-insensitive), or "".  The value is used if it agrees with
  
                      whether or not this resource enables TLS origination, or if
  
                      something else in the resource overrides the scheme.'
                    pattern: ^([hH][tT][tT][pP][sS]?://)?$
                    type: string
                  tls:
                    description: "TLS controls whether and how to represent the \"tls\"\
                      \ field when\nits value could be implied by the \"service\" field.\
                      \  In v2, there\nwere a lot of different ways to spell an \"empty\"\
                      \ value, and this\nfield specifies which way to spell it (and\
                      \ will therefore only\nbe used if the value will indeed be empty).\n\
                      \n | Value        | Representation                        | Meaning\
                      \ of representation          |\n |--------------+---------------------------------------+------------------------------------|\n\
                      \ | \"\"           | omit the field                        | defer\
                      \ to service (no TLSContext)   |\n | \"null\"       | store an\
                      \ explicit \"null\" in the field | defer to service (no TLSContext)\
                      \   |\n | \"string\"     | store an empty string in the field\
                      \    | defer to service (no TLSContext)   |\n | \"bool:false\"\
                      \ | store a Boolean \"false\" in the field  | defer to service\
                      \ (no TLSContext)   |\n | \"bool:true\"  | store a Boolean \"\
                      true\" in the field   | originate TLS (no TLSContext)      |\n\
                      \nIf the meaning of the representation contradicts anything else\n\
                      (if a TLSContext is to be used, or in the case of \"bool:true\"\
                      \ if\nTLS is not to be originated), then this field is ignored."
                    enum:
                    - ''
                    - 'null'
                    - bool:true
                    - bool:false
                    - string
                    type: string
                type: object
