[project]
name = "ambassador_diag"
version = "4.0.0-dev"
readme = "../README.md"
dependencies = [
    "click",
    "flask",
    "requests",
    "gunicorn",
    "jsonpatch",
    "expiringdict",
    "prometheus-client",
    "python-json-logger",
]


[project.scripts]
diagd = "ambassador_diag.diagd:main"


[build-system]
# Pinned below 1.32: that release rejects a `readme` outside the project
# directory ("Readme path must be within the project directory"), and this
# package's readme is ../README.md. Since hatchling was unpinned and uv.lock
# is not committed, the 1.32.0 release broke every CI job at dependency
# install with no code change. Drop the pin once the readme lives in this
# directory.
requires = ["hatchling<1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ambassador_diag"]

[tool.hatch.build.targets.sdist]
include = [
    "templates/*.ico",
    "templates/*.html",
]


[tool.ruff.lint.isort]
known-local-folder = ["ambassador_diag"]
